# PR Guard Configuration

pr:
  title:
    conventional: true
    types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    scopes:
      - api
      - ui
      - db
      - auth
      - deps
    max_length: 100
    min_length: 10
    pattern: "^[a-z]+(\\([a-z]+\\))?!?: .+$"

  description:
    required: true
    min_length: 20
    check_template: true
    keywords:
      - "changes"
      - "fixes"
      - "closes"
      - "breaking"

  branch:
    pattern: "^(feature|bugfix|hotfix|release|chore)/[a-z0-9-]+$"
    allowed_prefixes:
      - feature/
      - bugfix/
      - hotfix/
      - release/
      - chore/

  commits:
    validate_all: true
    ignore_merge: true
    allowed_types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    require_scope: false
    subject_length:
      max: 50
      min: 3

  labels:
    require:
      - "ready-for-review"
    forbid:
      - "do-not-merge"
      - "work-in-progress"

commits:
  conventional: true
  types:
    - name: "Feature"
      value: "feat"
    - name: "Bug Fix"
      value: "fix"
    - name: "Documentation"
      value: "docs"
    - name: "Style"
      value: "style"
    - name: "Refactor"
      value: "refactor"
    - name: "Performance"
      value: "perf"
    - name: "Test"
      value: "test"
    - name: "Build"
      value: "build"
    - name: "CI"
      value: "ci"
    - name: "Chore"
      value: "chore"
    - name: "Revert"
      value: "revert"
  scopes:
    - api
    - ui
    - db
    - auth
    - deps
  check_footer: true
  breaking_pattern: "BREAKING CHANGE:"
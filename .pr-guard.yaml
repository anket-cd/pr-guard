# PR Guard Configuration File

pr:
  title:
    conventional: true
    types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    scopes:
      - api
      - ui
      - db
      - auth
      - deps
      - config
      - docs
    max_length: 100
    min_length: 10
    pattern: "^[a-z]+(\\([a-z]+\\))?!?: .+$"

  description:
    required: true
    min_length: 20
    check_template: true
    keywords:
      - "changes"
      - "fixes"
      - "closes"
      - "resolves"
      - "breaking"

  # Branch naming follows same convention as commits
  branch:
    # Format: <type>/<ticket-id>-<short-description>
    # Example: feat/PROJ-123-add-user-authentication
    #          fix/123-resolve-null-pointer
    pattern: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[A-Z]+-[0-9]+-[a-z0-9-]+$|^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[0-9]+-[a-z0-9-]+$"
    allowed_types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    require_ticket: true  # Require ticket ID in branch name
    ticket_pattern: "([A-Z]+-[0-9]+|[0-9]+)"  # JIRA-123 or just 123

  commits:
    validate_all: true
    ignore_merge: true
    allowed_types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    require_scope: false
    subject_length:
      max: 50
      min: 3

  labels:
    require:
      - "ready-for-review"
    forbid:
      - "do-not-merge"
      - "work-in-progress"
      - "wip"
name: PR Guard Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, develop, 'release/*']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: PR Guard Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          
      - name: Install PR Guard
        run: |
          go install github.com/anket-cd/pr-guard/cmd/pr-guard@latest
          
      - name: Validate PR
        id: validate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-guard validate-pr \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --pr ${{ github.event.number }} \
            --config .pr-guard.yaml > validation-report.md
          
      - name: Read validation report
        id: report
        uses: juliangruber/read-file-action@v1
        with:
          path: ./validation-report.md
          
      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: PR Guard Validation Report
          
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          body-path: validation-report.md
          edit-mode: replace
          
      - name: Check validation result
        if: steps.validate.outcome == 'failure'
        run: |
          echo "❌ PR validation failed"
          cat validation-report.md
          exit 1
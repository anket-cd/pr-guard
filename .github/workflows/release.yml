name: Release PR Guard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  discussions: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          
      - name: Run tests
        run: go test -v ./...
        
      - name: Build binaries
        run: |
          mkdir -p dist
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -o dist/pr-guard-linux-amd64 ./cmd/pr-guard
          GOOS=linux GOARCH=arm64 go build -o dist/pr-guard-linux-arm64 ./cmd/pr-guard
          
          # macOS
          GOOS=darwin GOARCH=amd64 go build -o dist/pr-guard-darwin-amd64 ./cmd/pr-guard
          GOOS=darwin GOARCH=arm64 go build -o dist/pr-guard-darwin-arm64 ./cmd/pr-guard
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/pr-guard-windows-amd64.exe ./cmd/pr-guard
          
          # Create checksums
          cd dist
          sha256sum * > checksums.txt
          cd ..
          
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## PR Guard ${{ github.ref_name }}
            
            ### 🚀 Features
            - Comprehensive PR validation
            - Conventional commit checking
            - GitHub Actions integration
            - Local git hooks
            
            ### 📦 Installation
            ```bash
            # Using Go
            go install github.com/${{ github.repository }}@latest
            
            # Using binary
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pr-guard-linux-amd64
            chmod +x pr-guard-linux-amd64
            sudo mv pr-guard-linux-amd64 /usr/local/bin/pr-guard